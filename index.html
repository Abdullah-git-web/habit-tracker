<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Track your daily habits — water intake, reading, exercise, study, and more. Build streaks and stay consistent.">
    <meta name="theme-color" content="#10b981">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Personal Personal Habit Tracker</title>
    <style>
        :root {
            --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-card: #111111;
            --bg-card-hover: #1a1a1a;
            --bg-input: #1a1a1a;
            --bg-modal: #0a0a0a;
            --border: #222222;
            --border-focus: #10b981;
            --text-primary: #e8e6f0;
            --text-secondary: #9a97b0;
            --text-muted: #6b6880;
            --accent: #10b981;
            --accent-hover: #34d399;
            --accent-glow: rgba(16, 185, 129, 0.15);
            --success: #2dd4a0;
            --success-bg: rgba(45, 212, 160, 0.12);
            --danger: #ff6b8a;
            --danger-bg: rgba(255, 107, 138, 0.12);
            --warning: #fbbf24;
            --warning-bg: rgba(251, 191, 36, 0.12);
            --info: #38bdf8;
            --info-bg: rgba(56, 189, 248, 0.12);
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.5);
        }

        [data-theme="light"] {
            --bg-primary: #f5f5f9;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f0f6;
            --bg-input: #f0f0f6;
            --bg-modal: #ffffff;
            --border: #e2e2ea;
            --border-focus: #10b981;
            --text-primary: #1a1a2e;
            --text-secondary: #5a5a7a;
            --text-muted: #9a9ab0;
            --accent: #10b981;
            --accent-hover: #059669;
            --accent-glow: rgba(16, 185, 129, 0.1);
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.08);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.08);
            --warning: #f59e0b;
            --warning-bg: rgba(245, 158, 11, 0.08);
            --info: #3b82f6;
            --info-bg: rgba(59, 130, 246, 0.08);
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.1);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-main);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background var(--transition), color var(--transition);
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        .app { max-width: 1200px; margin: 0 auto; padding: 20px; }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 0 30px; flex-wrap: wrap; gap: 16px;
        }
        .header-left h1 {
            font-size: 28px; font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #6ee7b7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .header-left p { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }
        .header-actions { display: flex; gap: 10px; align-items: center; }

        .btn {
            display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border: none;
            border-radius: var(--radius-sm); font-family: var(--font-main); font-size: 14px;
            font-weight: 500; cursor: pointer; transition: all var(--transition); white-space: nowrap;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(16,185,129,0.3); }
        .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-ghost:hover { background: var(--bg-card-hover); color: var(--text-primary); }
        .btn-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid transparent; }
        .btn-danger:hover { border-color: var(--danger); }

        .btn-icon {
            width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center;
            border-radius: var(--radius-sm); background: var(--bg-card); border: 1px solid var(--border);
            color: var(--text-secondary); cursor: pointer; transition: all var(--transition); font-size: 18px;
        }
        .btn-icon:hover { background: var(--bg-card-hover); color: var(--text-primary); }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 30px; }
        .stat-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 20px; transition: all var(--transition);
        }
        .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
        .stat-card .stat-icon {
            width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center;
            justify-content: center; font-size: 20px; margin-bottom: 12px;
        }
        .stat-card .stat-value { font-size: 28px; font-weight: 700; line-height: 1; }
        .stat-card .stat-label { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
        .stat-icon.purple { background: var(--accent-glow); }
        .stat-icon.green { background: var(--success-bg); }
        .stat-icon.orange { background: var(--warning-bg); }
        .stat-icon.blue { background: var(--info-bg); }

        .section-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .tabs { display: flex; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px; gap: 2px; }
        .tab {
            padding: 8px 16px; border: none; background: transparent; color: var(--text-secondary);
            font-family: var(--font-main); font-size: 13px; font-weight: 500; cursor: pointer;
            border-radius: 6px; transition: all var(--transition);
        }
        .tab:hover { color: var(--text-primary); }
        .tab.active { background: var(--accent); color: #fff; }
        .date-nav { display: flex; align-items: center; gap: 12px; }
        .date-nav .date-display { font-size: 15px; font-weight: 600; min-width: 180px; text-align: center; }

        .habits-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
        .habit-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 20px; transition: all var(--transition); position: relative; overflow: hidden;
        }
        .habit-card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
        .habit-card.completed { border-color: var(--success); }
        .habit-card.completed::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--success);
        }
        .habit-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .habit-info { display: flex; align-items: center; gap: 14px; flex: 1; }
        .habit-emoji {
            width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center;
            justify-content: center; font-size: 24px; flex-shrink: 0;
        }
        .habit-details h3 { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
        .habit-details .habit-desc { font-size: 13px; color: var(--text-secondary); }
        .habit-actions { display: flex; gap: 8px; align-items: center; }
        .habit-progress { display: flex; align-items: center; gap: 14px; }
        .progress-bar-container { flex: 1; height: 8px; background: var(--bg-input); border-radius: 4px; overflow: hidden; min-width: 120px; }
        .progress-bar { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
        .progress-text { font-size: 13px; font-weight: 600; color: var(--text-secondary); min-width: 50px; text-align: right; }
        .habit-meta { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
        .meta-tag {
            display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-muted);
            background: var(--bg-input); padding: 4px 10px; border-radius: 20px;
        }
        .streak-badge { color: var(--warning); background: var(--warning-bg); font-weight: 600; }

        .counter-controls { display: flex; align-items: center; gap: 6px; }
        .counter-btn {
            width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg-input); color: var(--text-secondary); font-size: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all var(--transition);
        }
        .counter-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
        .counter-value { font-size: 15px; font-weight: 700; min-width: 30px; text-align: center; }

        .check-btn {
            width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--border);
            background: transparent; cursor: pointer; display: flex; align-items: center;
            justify-content: center; transition: all var(--transition); color: transparent; font-size: 16px;
        }
        .check-btn:hover { border-color: var(--success); background: var(--success-bg); }
        .check-btn.checked { background: var(--success); border-color: var(--success); color: #fff; }

        .calendar-container {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 24px; margin-bottom: 30px;
        }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .calendar-header h3 { font-size: 18px; font-weight: 600; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .calendar-day-label { text-align: center; font-size: 12px; font-weight: 600; color: var(--text-muted); padding: 8px 0; }
        .calendar-day {
            aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center;
            justify-content: center; font-size: 13px; cursor: default; position: relative; transition: all var(--transition);
        }
        .calendar-day.empty { pointer-events: none; }
        .calendar-day.today { border: 2px solid var(--accent); font-weight: 700; }
        .calendar-day.full-completion { background: var(--success-bg); color: var(--success); font-weight: 600; }
        .calendar-day.partial-completion { background: var(--warning-bg); color: var(--warning); }
        .calendar-day.no-completion { color: var(--text-muted); }

        .heatmap-container {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 24px; margin-bottom: 30px;
        }
        .heatmap-container h3 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
        .heatmap-grid { display: grid; grid-template-columns: 120px repeat(7, 1fr); gap: 6px; align-items: center; }
        .heatmap-habit-name { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .heatmap-cell {
            aspect-ratio: 1; max-height: 40px; border-radius: 6px; display: flex; align-items: center;
            justify-content: center; font-size: 11px; font-weight: 600; transition: all var(--transition);
        }
        .heatmap-cell.level-0 { background: var(--bg-input); color: var(--text-muted); }
        .heatmap-cell.level-1 { background: rgba(16,185,129,0.15); color: var(--accent); }
        .heatmap-cell.level-2 { background: rgba(16,185,129,0.3); color: var(--accent); }
        .heatmap-cell.level-3 { background: rgba(45,212,160,0.2); color: var(--success); }
        .heatmap-cell.level-4 { background: var(--success); color: #fff; }
        .heatmap-day-label { font-size: 11px; color: var(--text-muted); text-align: center; font-weight: 600; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center;
            z-index: 1000; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-modal); border: 1px solid var(--border); border-radius: var(--radius);
            width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto;
            box-shadow: var(--shadow-lg); animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 24px; border-bottom: 1px solid var(--border);
        }
        .modal-header h2 { font-size: 18px; font-weight: 600; }
        .modal-body { padding: 24px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px 14px; background: var(--bg-input); border: 1px solid var(--border);
            border-radius: var(--radius-sm); color: var(--text-primary); font-family: var(--font-main);
            font-size: 14px; transition: border-color var(--transition);
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--border-focus); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .emoji-picker-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .emoji-option {
            width: 40px; height: 40px; border-radius: 8px; border: 2px solid var(--border);
            background: var(--bg-input); font-size: 20px; cursor: pointer; display: flex;
            align-items: center; justify-content: center; transition: all var(--transition);
        }
        .emoji-option:hover { border-color: var(--accent); }
        .emoji-option.selected { border-color: var(--accent); background: var(--accent-glow); }
        .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

        .quote-bar {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 16px 24px; margin-bottom: 24px; display: flex; align-items: center;
            gap: 14px; font-style: italic; color: var(--text-secondary); font-size: 14px;
        }
        .quote-bar .quote-icon { font-size: 24px; flex-shrink: 0; }

        .filter-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .pill {
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: transparent;
            color: var(--text-secondary); font-family: var(--font-main); font-size: 12px; font-weight: 500;
            cursor: pointer; transition: all var(--transition);
        }
        .pill:hover { border-color: var(--accent); color: var(--text-primary); }
        .pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .empty-state h3 { font-size: 18px; color: var(--text-secondary); margin-bottom: 8px; }

        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
        .toast {
            padding: 12px 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500;
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards; box-shadow: var(--shadow);
        }
        .toast.success { background: var(--success); color: #fff; }
        .toast.error { background: var(--danger); color: #fff; }
        .toast.info { background: var(--accent); color: #fff; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(10px); } }

        .detail-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
        .detail-stat { background: var(--bg-input); border-radius: var(--radius-sm); padding: 14px; text-align: center; }
        .detail-stat .ds-value { font-size: 22px; font-weight: 700; }
        .detail-stat .ds-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

        .notes-section { margin-top: 12px; }
        .notes-section textarea {
            width: 100%; min-height: 60px; padding: 10px 14px; background: var(--bg-input);
            border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary);
            font-family: var(--font-main); font-size: 13px; resize: vertical; transition: border-color var(--transition);
        }
        .notes-section textarea:focus { outline: none; border-color: var(--border-focus); }
        .notes-section textarea::placeholder { color: var(--text-muted); }

        /* ===== SUBMIT BAR ===== */
        .submit-bar {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 20px 24px; display: flex; align-items: center; gap: 20px;
            margin-top: 16px; margin-bottom: 20px; flex-wrap: wrap;
        }
        .submit-progress-info { flex: 1; min-width: 180px; }
        .submit-progress-info span { font-size: 14px; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 8px; }
        .submit-progress-track {
            height: 10px; background: var(--bg-input); border-radius: 5px; overflow: hidden; width: 100%;
        }
        .submit-progress-fill {
            height: 100%; border-radius: 5px; transition: width 0.5s ease, background 0.3s ease;
            background: linear-gradient(90deg, var(--accent), #a78bfa);
        }
        .submit-progress-fill.ready { background: linear-gradient(90deg, var(--success), #34d399); }
        .btn-submit {
            display: inline-flex; align-items: center; gap: 8px; padding: 14px 32px; border: none;
            border-radius: var(--radius-sm); font-family: var(--font-main); font-size: 16px;
            font-weight: 600; cursor: pointer; transition: all var(--transition); white-space: nowrap;
            background: var(--border); color: var(--text-muted);
        }
        .btn-submit:disabled { cursor: not-allowed; opacity: 0.6; }
        .btn-submit.ready {
            background: rgba(16, 185, 129, 0.15); color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3); opacity: 1;
        }
        .btn-submit.ready:hover { transform: translateY(-2px); background: rgba(16, 185, 129, 0.22); border-color: rgba(16, 185, 129, 0.5); }
        .btn-submit.submitted {
            background: var(--bg-input); color: var(--text-muted); border: 1px solid var(--border); opacity: 0.7;
            cursor: default;
        }
        .btn-submit.ready { animation: none; }

        /* ===== MOOD CHECK-IN ===== */
        .mood-checkin {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 18px 24px; margin-bottom: 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
        }
        .mood-checkin .mood-label { font-size: 14px; font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
        .mood-options { display: flex; gap: 6px; }
        .mood-btn {
            width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--border);
            background: transparent; font-size: 22px; cursor: pointer; transition: all var(--transition);
            display: flex; align-items: center; justify-content: center;
        }
        .mood-btn:hover { border-color: var(--accent); transform: scale(1.15); }
        .mood-btn.selected { border-color: var(--accent); background: var(--accent-glow); transform: scale(1.15); }
        .energy-slider-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 180px; }
        .energy-slider-wrap label { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
        .energy-slider {
            -webkit-appearance: none; appearance: none; flex: 1; height: 6px;
            background: var(--bg-input); border-radius: 3px; outline: none;
        }
        .energy-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
            background: var(--accent); cursor: pointer; border: 2px solid var(--bg-primary);
        }
        .energy-val { font-size: 14px; font-weight: 700; color: var(--accent); min-width: 20px; text-align: center; }
        .mood-insight {
            width: 100%; margin-top: 8px; padding: 10px 14px; background: var(--bg-input);
            border-radius: var(--radius-sm); font-size: 13px; color: var(--text-secondary);
            display: none;
        }
        .mood-insight.visible { display: block; }

        /* ===== LEADERBOARD ===== */
        .leaderboard { margin-bottom: 30px; }
        .lb-item {
            display: flex; align-items: center; gap: 14px; padding: 14px 18px;
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
            margin-bottom: 8px; transition: all var(--transition);
        }
        .lb-item:hover { border-color: var(--accent); }
        .lb-rank {
            width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0;
        }
        .lb-rank.gold { background: rgba(251,191,36,0.15); color: #fbbf24; }
        .lb-rank.silver { background: rgba(148,163,184,0.15); color: #94a3b8; }
        .lb-rank.bronze { background: rgba(217,119,6,0.15); color: #d97706; }
        .lb-rank.normal { background: var(--bg-input); color: var(--text-muted); }
        .lb-info { flex: 1; min-width: 0; }
        .lb-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .lb-stats { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .lb-score { font-size: 20px; font-weight: 700; color: var(--accent); text-align: right; }
        .lb-score small { font-size: 11px; color: var(--text-muted); font-weight: 500; display: block; }
        .lb-bar { width: 100px; height: 6px; background: var(--bg-input); border-radius: 3px; overflow: hidden; flex-shrink: 0; }
        .lb-bar-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width 0.5s ease; }

        /* ===== FOCUS MODE ===== */
        .focus-mode-toggle {
            display: flex; align-items: center; gap: 8px; margin-left: auto;
        }
        .focus-switch {
            width: 44px; height: 24px; border-radius: 12px; background: var(--border);
            position: relative; cursor: pointer; transition: background var(--transition); border: none;
        }
        .focus-switch::after {
            content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
            border-radius: 50%; background: var(--text-muted); transition: all var(--transition);
        }
        .focus-switch.on { background: var(--accent); }
        .focus-switch.on::after { left: 23px; background: #fff; }
        .focus-label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
        .habit-card.focus-dimmed { opacity: 0.15; pointer-events: none; transform: scale(0.98); }
        .habit-card.focus-active { border-color: var(--accent); box-shadow: 0 0 20px rgba(16,185,129,0.1); }
        .focus-nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 16px; }
        .focus-nav.hidden { display: none; }

        /* ===== HISTORY ===== */
        .history-day {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 20px 24px; margin-bottom: 16px; transition: all var(--transition);
        }
        .history-day:hover { box-shadow: var(--shadow); }
        .history-day-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
        }
        .history-day-header h3 { font-size: 16px; font-weight: 600; }
        .history-day-header .history-time { font-size: 12px; color: var(--text-muted); }
        .history-day-header .history-badge {
            font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px;
        }
        .history-badge.perfect { background: var(--success-bg); color: var(--success); }
        .history-badge.submitted { background: var(--info-bg); color: var(--info); }
        .history-badge.partial { background: var(--warning-bg); color: var(--warning); }
        .history-habits-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px;
        }
        .history-habit-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 14px;
            background: var(--bg-input); border-radius: var(--radius-sm);
        }
        .history-habit-item .hh-emoji { font-size: 20px; flex-shrink: 0; }
        .history-habit-item .hh-info { flex: 1; min-width: 0; }
        .history-habit-item .hh-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-habit-item .hh-progress-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
        .history-habit-item .hh-bar { flex: 1; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
        .history-habit-item .hh-bar-fill { height: 100%; border-radius: 3px; }
        .history-habit-item .hh-val { font-size: 11px; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
        .history-habit-item .hh-status {
            width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 12px; flex-shrink: 0;
        }
        .hh-status.done { background: var(--success-bg); color: var(--success); }
        .hh-status.partial { background: var(--warning-bg); color: var(--warning); }
        .history-habit-item .hh-note { font-size: 11px; color: var(--text-muted); font-style: italic; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .history-empty .empty-icon { font-size: 48px; margin-bottom: 12px; }

        /* ===== CONFETTI CANVAS ===== */
        #confettiCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999;
        }

        /* ===== ACHIEVEMENTS ===== */
        .achievements-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-bottom: 30px;
        }
        .achievement-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 20px; text-align: center; transition: all var(--transition); position: relative; overflow: hidden;
        }
        .achievement-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
        .achievement-card.unlocked { border-color: var(--warning); }
        .achievement-card.unlocked::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--warning), #f59e0b, var(--warning));
        }
        .achievement-card.locked { opacity: 0.5; }
        .achievement-icon { font-size: 36px; margin-bottom: 10px; }
        .achievement-card h4 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .achievement-card p { font-size: 12px; color: var(--text-muted); }
        .achievement-card .ach-date { font-size: 11px; color: var(--success); margin-top: 6px; font-weight: 500; }
        .achievement-card .ach-progress {
            margin-top: 8px; height: 4px; background: var(--bg-input); border-radius: 2px; overflow: hidden;
        }
        .achievement-card .ach-progress-bar {
            height: 100%; background: var(--warning); border-radius: 2px; transition: width 0.4s ease;
        }

        /* ===== POMODORO TIMER ===== */
        .pomodoro-container {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 30px; text-align: center; max-width: 400px; margin: 0 auto;
        }
        .pomodoro-display {
            font-size: 64px; font-weight: 700; font-variant-numeric: tabular-nums;
            letter-spacing: 2px; margin: 20px 0;
            background: linear-gradient(135deg, var(--accent), #6ee7b7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .pomodoro-label {
            font-size: 14px; color: var(--text-secondary); font-weight: 500;
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;
        }
        .pomodoro-controls { display: flex; justify-content: center; gap: 12px; margin-top: 20px; }
        .pomodoro-controls .btn { min-width: 100px; justify-content: center; }
        .pomodoro-presets { display: flex; justify-content: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
        .pomodoro-presets .pill { font-size: 12px; }
        .pomodoro-stats {
            display: flex; justify-content: center; gap: 24px; margin-top: 20px;
            padding-top: 16px; border-top: 1px solid var(--border);
        }
        .pomodoro-stat-item { text-align: center; }
        .pomodoro-stat-item .ps-val { font-size: 20px; font-weight: 700; color: var(--accent); }
        .pomodoro-stat-item .ps-lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .pomo-ring {
            width: 200px; height: 200px; margin: 0 auto; position: relative;
        }
        .pomo-ring svg { transform: rotate(-90deg); }
        .pomo-ring .ring-bg { fill: none; stroke: var(--bg-input); stroke-width: 8; }
        .pomo-ring .ring-fg { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
        .pomo-ring .ring-time {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 42px; font-weight: 700; font-variant-numeric: tabular-nums;
            background: linear-gradient(135deg, var(--accent), #6ee7b7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .pomo-ring .ring-label {
            position: absolute; top: 62%; left: 50%; transform: translateX(-50%);
            font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            .app { padding: 12px; }
            .header { padding: 12px 0 20px; }
            .header-left h1 { font-size: 22px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .stat-card { padding: 14px; }
            .stat-card .stat-value { font-size: 22px; }
            .habit-card { padding: 14px; }
            .habit-info { gap: 10px; }
            .habit-emoji { width: 40px; height: 40px; font-size: 20px; }
            .heatmap-grid { grid-template-columns: 80px repeat(7, 1fr); gap: 4px; }
            .form-row { grid-template-columns: 1fr; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .header-actions { width: 100%; justify-content: flex-end; }
            .habit-progress { flex-direction: column; align-items: stretch; gap: 6px; }
            .progress-text { text-align: left; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-left">
                <h1>Personal Habit Tracker</h1>
                <p id="headerDate"></p>
            </div>

                <button class="btn-icon" id="importBtn" title="Import data">&#x1F4E5;</button>

                <button class="btn btn-primary" id="addHabitBtn">+ New Habit</button>

        <div class="quote-bar">
            <span class="quote-icon">&#x1F4A1;</span>

        <!-- Mood Check-in -->
        <div class="mood-checkin" id="moodCheckin">

                <button class="mood-btn" data-mood="1" title="Awful">&#x1F629;</button>
                <button class="mood-btn" data-mood="2" title="Bad">&#x1F61E;</button>
                <button class="mood-btn" data-mood="3" title="Okay">&#x1F610;</button>
                <button class="mood-btn" data-mood="4" title="Good">&#x1F60A;</button>
                <button class="mood-btn" data-mood="5" title="Amazing">&#x1F929;</button>
            </div>
            <div class="energy-slider-wrap">
                <label>&#x26A1; Energy</label>
                <input type="range" class="energy-slider" id="energySlider" min="1" max="10" value="5">
                <span class="energy-val" id="energyVal">5</span>
            </div>
            <div class="mood-insight" id="moodInsight"></div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon purple">&#x1F4CA;</div>
                <div class="stat-value" id="statCompleted">0</div>
                <div class="stat-label">Completed Today</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green">&#x2705;</div>
                <div class="stat-value" id="statRate">0%</div>
                <div class="stat-label">Completion Rate</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange">&#x1F525;</div>
                <div class="stat-value" id="statStreak">0</div>
                <div class="stat-label">Best Streak</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon blue">&#x2B50;</div>
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-label">Total Habits</div>
            </div>
        </div>

        <div class="section-nav">
            <div class="tabs">
                <button class="tab active" data-view="today">Today</button>
                <button class="tab" data-view="calendar">Calendar</button>
                <button class="tab" data-view="heatmap">Heatmap</button>
                <button class="tab" data-view="achievements">Achievements</button>
                <button class="tab" data-view="pomodoro">Timer</button>
                <button class="tab" data-view="leaderboard">Leaderboard</button>
                <button class="tab" data-view="history">History</button>
            </div>
            <div class="date-nav">
                <button class="btn-icon" id="prevDate">&#x25C0;</button>
                <span class="date-display" id="dateDisplay"></span>
                <button class="btn-icon" id="nextDate">&#x25B6;</button>
            </div>
        </div>

        <div class="filter-pills" id="filterPills">
            <button class="pill active" data-filter="all">All</button>
            <button class="pill" data-filter="pending">Pending</button>
            <button class="pill" data-filter="completed">Completed</button>
            <div class="focus-mode-toggle">
                <span class="focus-label">Focus Mode</span>
                <button class="focus-switch" id="focusToggle" title="Focus on one habit at a time"></button>
            </div>
        </div>
        <div class="focus-nav hidden" id="focusNav">
            <button class="btn-icon" id="focusPrev" title="Previous habit">&#x25C0;</button>
            <span id="focusCounter" style="font-size:13px;color:var(--text-secondary);font-weight:600;min-width:60px;text-align:center"></span>
            <button class="btn-icon" id="focusNext" title="Next habit">&#x25B6;</button>
        </div>

        <div id="todayView">
            <div class="habits-list" id="habitsList"></div>
            <div id="submitSection" style="display:none">
                <div class="submit-bar">
                    <div class="submit-progress-info">
                        <span id="submitProgressText">0/0 habits completed</span>
                        <div class="submit-progress-track">
                            <div class="submit-progress-fill" id="submitProgressFill" style="width:0%"></div>
                        </div>
                    </div>
                    <button class="btn btn-submit" id="submitDayBtn" disabled>Submit Day</button>
                </div>
            </div>
        </div>

        <div id="calendarView" style="display:none">
            <div class="calendar-container">
                <div class="calendar-header">
                    <h3 id="calendarTitle"></h3>
                    <div style="display:flex;gap:8px;">
                        <button class="btn-icon" id="prevMonth">&#x25C0;</button>
                        <button class="btn-icon" id="nextMonth">&#x25B6;</button>
                    </div>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>
        </div>

        <div id="heatmapView" style="display:none">
            <div class="heatmap-container">
                <h3>Weekly Activity</h3>
                <div class="heatmap-grid" id="heatmapGrid"></div>
            </div>
        </div>

        <div id="achievementsView" style="display:none">
            <div class="achievements-grid" id="achievementsGrid"></div>
        </div>

        <div id="pomodoroView" style="display:none">

                    <svg width="200" height="200" viewBox="0 0 200 200">
                        <circle class="ring-bg" cx="100" cy="100" r="90"/>
                        <circle class="ring-fg" id="pomoRing" cx="100" cy="100" r="90"
                            stroke-dasharray="565.49" stroke-dashoffset="0"/>
                    </svg>
                    <div class="ring-time" id="pomoDisplay">25:00</div>
                    <div class="ring-label" id="pomoRingLabel">ready</div>
                </div>

                    <button class="btn btn-ghost" id="pomoResetBtn">Reset</button>

                    <button class="pill" data-pomo-mins="45">45 min</button>
                    <button class="pill" data-pomo-mins="60">60 min</button>
                    <button class="pill" data-pomo-mins="5">5 min break</button>

                <div class="pomodoro-stats">
                    <div class="pomodoro-stat-item">
                        <div class="ps-val" id="pomoSessionCount">0</div>
                        <div class="ps-lbl">Sessions Today</div>
                    </div>
                    <div class="pomodoro-stat-item">
                        <div class="ps-val" id="pomoTotalMins">0</div>
                        <div class="ps-lbl">Minutes Focused</div>
                    </div>
                    <div class="pomodoro-stat-item">
                        <div class="ps-val" id="pomoAllTime">0</div>
                        <div class="ps-lbl">All-Time Sessions</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="leaderboardView" style="display:none">
            <div class="leaderboard" id="leaderboardContent"></div>
        </div>

        <div id="historyView" style="display:none">
            <div id="historyContent"></div>
        </div>
    </div>

    <canvas id="confettiCanvas"></canvas>

    <div class="modal-overlay" id="habitModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Habit</h2>
                <button class="btn-icon" id="closeModal">&#x2715;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Emoji Icon</label>
                    <div class="emoji-picker-grid" id="emojiPicker"></div>
                </div>
                <div class="form-group">
                    <label>Habit Name</label>
                    <input type="text" id="habitName" placeholder="e.g., Morning Meditation" maxlength="50">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="habitDesc" placeholder="Brief description (optional)" maxlength="100">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Type</label>
                        <select id="habitType">
                            <option value="checkbox">Checkbox (Yes/No)</option>
                            <option value="counter">Counter (Incremental)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Daily Goal</label>
                        <input type="number" id="habitGoal" min="1" max="9999" value="1">
                    </div>
                </div>
                <div class="form-group">
                    <label>Unit (for counter type)</label>
                    <input type="text" id="habitUnit" placeholder="e.g., glasses, pages, minutes" maxlength="20">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="habitCategory">
                        <option value="health">&#x1F3E5; Health</option>
                        <option value="fitness">&#x1F4AA; Fitness</option>
                        <option value="learning">&#x1F4D6; Learning</option>
                        <option value="mindfulness">&#x1F9D8; Mindfulness</option>
                        <option value="productivity">&#x26A1; Productivity</option>
                        <option value="social">&#x1F465; Social</option>
                        <option value="quit">&#x1F6AB; Quit Bad Habit</option>
                        <option value="other">&#x1F4CC; Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Color</label>
                    <input type="color" id="habitColor" value="#6c63ff">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" id="cancelModal">Cancel</button>
                <button class="btn btn-danger" id="deleteHabit" style="display:none">Delete</button>
                <button class="btn btn-primary" id="saveHabit">Save Habit</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="detailModal">
        <div class="modal" style="max-width:600px">
            <div class="modal-header">
                <h2 id="detailTitle">Habit Details</h2>
                <button class="btn-icon" id="closeDetailModal">&#x2715;</button>
            </div>
            <div class="modal-body" id="detailBody"></div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

            { name: 'Study', emoji: '\uD83D\uDCD6', desc: 'Focused study sessions', type: 'counter', goal: 60, unit: 'minutes', category: 'learning', color: '#fbbf24' },
            { name: 'Sleep', emoji: '\uD83D\uDECC', desc: 'Get enough quality sleep', type: 'counter', goal: 8, unit: 'hours', category: 'health', color: '#818cf8' },
            { name: 'Meditation', emoji: '\uD83E\uDDD8', desc: 'Calm your mind daily', type: 'counter', goal: 10, unit: 'minutes', category: 'mindfulness', color: '#c084fc' },
            { name: 'Walk', emoji: '\uD83D\uDEB6', desc: 'Take a walk or hit step goal', type: 'counter', goal: 5000, unit: 'steps', category: 'fitness', color: '#34d399' },
            { name: 'Healthy Eating', emoji: '\uD83E\uDD57', desc: 'Eat balanced meals with fruits & veggies', type: 'counter', goal: 3, unit: 'meals', category: 'health', color: '#4ade80' },
            { name: 'No Social Media', emoji: '\uD83D\uDEAB', desc: 'Limit mindless scrolling', type: 'checkbox', goal: 1, unit: '', category: 'productivity', color: '#f87171' },
        ];

        var selectedEmoji = '\uD83C\uDFAF';

        function dateKey(d) {
            var dt = new Date(d);
            return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
        }

        function formatDate(d) {
            return new Date(d).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }

        function formatShortDate(d) {
            return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
        }

        function escHtml(str) {
            var div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        function getCategoryLabel(cat) {
            var labels = {
                health: '\uD83C\uDFE5 Health', fitness: '\uD83D\uDCAA Fitness', learning: '\uD83D\uDCD6 Learning',
                mindfulness: '\uD83E\uDDD8 Mindfulness', productivity: '\u26A1 Productivity',
                social: '\uD83D\uDC65 Social', quit: '\uD83D\uDEAB Quit Bad Habit', other: '\uD83D\uDCCC Other'
            };
            return labels[cat] || '\uD83D\uDCCC Other';
        }

        function save() {
            var data = { habits: state.habits, logs: state.logs };
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
            catch(e) { console.error('Save failed:', e); }
        }

        function load() {
            try {
                var raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    var data = JSON.parse(raw);
                    state.habits = Array.isArray(data.habits) ? data.habits : [];
                    state.logs = data.logs && typeof data.logs === 'object' ? data.logs : {};

                    // Migrate: add new defaults & remove retired ones with no progress
                    var defaultNames = {};
                    DEFAULT_HABITS.forEach(function(h) { defaultNames[h.name] = true; });
                    var existingNames = {};
                    state.habits.forEach(function(h) { existingNames[h.name] = true; });
                    var changed = false;

                    // Add missing defaults
                    DEFAULT_HABITS.forEach(function(h) {
                        if (!existingNames[h.name]) {
                            state.habits.push({
                                id: generateId(), name: h.name, emoji: h.emoji, desc: h.desc,
                                type: h.type, goal: h.goal, unit: h.unit, category: h.category,
                                color: h.color, createdAt: new Date().toISOString(),
                            });
                            changed = true;
                        }
                    });

                    // Remove retired defaults only if user has no logged progress
                    var retired = ['Gratitude Journal','Coding Practice','Hydrate with Lemon Water','Budget Tracking','No Screen Before Bed'];
                    state.habits = state.habits.filter(function(h) {
                        if (retired.indexOf(h.name) === -1) return true;
                        var hasProgress = Object.keys(state.logs).some(function(dk) {
                            return state.logs[dk][h.id] && state.logs[dk][h.id].value > 0;
                        });
                        if (hasProgress) return true;
                        changed = true;
                        return false;
                    });

                    if (changed) save();
                } else {
                    state.habits = DEFAULT_HABITS.map(function(h) {
                        return {
                            id: generateId(), name: h.name, emoji: h.emoji, desc: h.desc,
                            type: h.type, goal: h.goal, unit: h.unit, category: h.category,
                            color: h.color, createdAt: new Date().toISOString(),
                        };
                    });
                    state.logs = {};
                    save();
                }
            } catch(e) {
                console.error('Load failed:', e);
                state.habits = [];
                state.logs = {};
            }
        }

        function getLog(date, habitId) {
            var dk = dateKey(date);
            if (!state.logs[dk]) return null;
            return state.logs[dk][habitId] || null;
        }

        function setLog(date, habitId, value, notes) {
            var dk = dateKey(date);
            if (!state.logs[dk]) state.logs[dk] = {};
            var habit = state.habits.find(function(h) { return h.id === habitId; });
            if (!habit) return;
            state.logs[dk][habitId] = {
                value: Math.max(0, value),
                completed: value >= habit.goal,
                notes: notes || (state.logs[dk][habitId] ? state.logs[dk][habitId].notes || '' : ''),
            };
            save();
        }

        function getCompletionRate(date) {
            if (state.habits.length === 0) return 0;
            var dk = dateKey(date);
            var dayLogs = state.logs[dk] || {};
            var completed = 0;
            state.habits.forEach(function(h) { if (dayLogs[h.id] && dayLogs[h.id].completed) completed++; });
            return Math.round((completed / state.habits.length) * 100);
        }

        function getStreak(habitId) {
            var streak = 0, today = new Date();
            for (var i = 0; i < 365; i++) {
                var d = new Date(today); d.setDate(d.getDate() - i);
                var log = getLog(d, habitId);
                if (log && log.completed) streak++; else break;
            }
            return streak;
        }

        function getBestStreak(habitId) {
            var best = 0, current = 0, today = new Date();
            for (var i = 0; i < 365; i++) {
                var d = new Date(today); d.setDate(d.getDate() - i);
                var log = getLog(d, habitId);
                if (log && log.completed) { current++; if (current > best) best = current; }
                else current = 0;
            }
            return best;
        }

        function getOverallBestStreak() {
            var best = 0;
            state.habits.forEach(function(h) { var s = getBestStreak(h.id); if (s > best) best = s; });
            return best;
        }

        function showToast(message, type) {
            var container = document.getElementById('toastContainer');
            var toast = document.createElement('div');
            toast.className = 'toast ' + (type || 'success');
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(function() { if (toast.parentNode) toast.remove(); }, 3000);
        }

        function render() {
            renderHeader(); renderQuote(); renderStats(); renderMoodCheckin(); renderHabits(); renderSubmitBar(); renderDateDisplay(); updateThemeIcon();
            if (state.activeView === 'calendar') renderCalendar();
            if (state.activeView === 'heatmap') renderHeatmap();
            if (state.activeView === 'achievements') renderAchievements();
            if (state.activeView === 'pomodoro') renderPomoStats();
            if (state.activeView === 'leaderboard') renderLeaderboard();
            if (state.activeView === 'history') renderHistory();
        }

        function renderHeader() {
            document.getElementById('headerDate').textContent = formatDate(new Date());
        }

        function renderQuote() {
            var today = new Date();
            var idx = (today.getFullYear() * 366 + today.getMonth() * 31 + today.getDate()) % QUOTES.length;
            document.getElementById('quoteText').textContent = QUOTES[idx];
        }

        function renderStats() {
            var dk = dateKey(state.viewDate);
            var dayLogs = state.logs[dk] || {};
            var completedCount = 0;
            state.habits.forEach(function(h) { if (dayLogs[h.id] && dayLogs[h.id].completed) completedCount++; });
            document.getElementById('statCompleted').textContent = completedCount;
            document.getElementById('statRate').textContent = state.habits.length > 0
                ? Math.round((completedCount / state.habits.length) * 100) + '%' : '0%';
            document.getElementById('statStreak').textContent = getOverallBestStreak();
            document.getElementById('statTotal').textContent = state.habits.length;
        }

        function renderDateDisplay() {
            document.getElementById('dateDisplay').textContent = formatDate(state.viewDate);
        }

        function renderHabits() {
            var list = document.getElementById('habitsList');
            var dk = dateKey(state.viewDate);
            var dayLogs = state.logs[dk] || {};
            var habits = state.habits.slice();

            if (state.activeFilter === 'completed') {
                habits = habits.filter(function(h) { return dayLogs[h.id] && dayLogs[h.id].completed; });
            } else if (state.activeFilter === 'pending') {
                habits = habits.filter(function(h) { return !(dayLogs[h.id] && dayLogs[h.id].completed); });
            }

            if (habits.length === 0) {
                var icon = state.habits.length === 0 ? '\uD83C\uDF31' : '\uD83C\uDF89';
                var title = state.habits.length === 0 ? 'No habits yet' : (state.activeFilter === 'completed' ? 'Nothing completed yet' : 'All done for today!');
                var sub = state.habits.length === 0 ? 'Add your first habit to get started!' : 'Keep going!';
                list.innerHTML = '<div class="empty-state"><div class="empty-icon">' + icon + '</div><h3>' + title + '</h3><p>' + sub + '</p></div>';
                renderSubmitBar();
                return;
            }

            list.innerHTML = habits.map(function(habit) {
                var log = dayLogs[habit.id] || { value: 0, completed: false, notes: '' };
                var progress = Math.min(100, Math.round((log.value / habit.goal) * 100));
                var streak = getStreak(habit.id);
                var actionsHtml;

                if (habit.type === 'counter') {
                    actionsHtml = '<div class="counter-controls">' +
                        '<button class="counter-btn" data-action="decrement" data-id="' + habit.id + '">\u2212</button>' +
                        '<span class="counter-value">' + log.value + '</span>' +
                        '<button class="counter-btn" data-action="increment" data-id="' + habit.id + '">+</button></div>';
                } else {
                    actionsHtml = '<button class="check-btn ' + (log.completed ? 'checked' : '') + '" data-action="toggle" data-id="' + habit.id + '">\u2713</button>';
                }

                return '<div class="habit-card ' + (log.completed ? 'completed' : '') + '">' +
                    '<div class="habit-top"><div class="habit-info">' +
                    '<div class="habit-emoji" style="background:' + escHtml(habit.color) + '15">' + escHtml(habit.emoji) + '</div>' +
                    '<div class="habit-details"><h3>' + escHtml(habit.name) + '</h3>' +
                    '<span class="habit-desc">' + escHtml(habit.desc) + '</span></div></div>' +
                    '<div class="habit-actions">' + actionsHtml +
                    '<button class="btn-icon" data-action="detail" data-id="' + habit.id + '" title="Details">\uD83D\uDCCB</button>' +
                    '<button class="btn-icon" data-action="edit" data-id="' + habit.id + '" title="Edit">\u270F\uFE0F</button>' +
                    '</div></div>' +
                    '<div class="habit-progress"><div class="progress-bar-container">' +
                    '<div class="progress-bar" style="width:' + progress + '%;background:linear-gradient(90deg,' + escHtml(habit.color) + ',' + escHtml(habit.color) + 'aa)"></div>' +
                    '</div><span class="progress-text">' + log.value + '/' + habit.goal + (habit.unit ? ' ' + escHtml(habit.unit) : '') + '</span></div>' +
                    '<div class="habit-meta">' +
                    (streak > 0 ? '<span class="meta-tag streak-badge">\uD83D\uDD25 ' + streak + ' day streak</span>' : '') +
                    '<span class="meta-tag">' + getCategoryLabel(habit.category) + '</span>' +
                    (log.notes ? '<span class="meta-tag">\uD83D\uDCDD Has notes</span>' : '') +
                    '</div>' +
                    '<div class="notes-section"><textarea placeholder="Add notes for today..." data-action="notes" data-id="' + habit.id + '">' + escHtml(log.notes || '') + '</textarea></div>' +
                    '</div>';
            }).join('');
            renderSubmitBar();
        }

        // ===== SUBMIT BAR =====
        function getSubmittedDays() {
            var raw = localStorage.getItem('habitTracker_submitted');
            return raw ? JSON.parse(raw) : {};
        }

        function renderSubmitBar() {
            var section = document.getElementById('submitSection');
            if (state.habits.length === 0) { section.style.display = 'none'; return; }
            section.style.display = '';

            var dk = dateKey(state.viewDate);
            var dayLogs = state.logs[dk] || {};
            var total = state.habits.length;
            var answered = 0;
            state.habits.forEach(function(h) {
                if (dayLogs[h.id] && dayLogs[h.id].value > 0) answered++;
            });
            var pct = Math.round((answered / total) * 100);
            var minRequired = 5;
            var canSubmit = answered >= minRequired;
            var submitted = getSubmittedDays();
            var isSubmitted = !!submitted[dk];

            document.getElementById('submitProgressText').textContent = answered + '/' + total + ' habits answered (min ' + minRequired + ' required)';
            document.getElementById('submitProgressFill').style.width = pct + '%';

            var fill = document.getElementById('submitProgressFill');
            if (canSubmit) fill.classList.add('ready'); else fill.classList.remove('ready');

            var btn = document.getElementById('submitDayBtn');
            btn.disabled = !canSubmit || isSubmitted;
            btn.className = 'btn btn-submit';

            if (isSubmitted) {
                btn.classList.add('submitted');
                btn.textContent = '\u2705 Day Submitted';
            } else if (canSubmit) {
                btn.classList.add('ready');
                btn.textContent = '\uD83D\uDE80 Submit Day (' + answered + '/' + total + ')';
            } else {
                btn.textContent = 'Submit Day (' + (minRequired - answered) + ' more needed)';
            }
        }

        function submitDay() {
            var dk = dateKey(state.viewDate);
            var dayLogs = state.logs[dk] || {};
            var answered = 0;
            state.habits.forEach(function(h) {
                if (dayLogs[h.id] && dayLogs[h.id].value > 0) answered++;
            });
            if (answered < 5) { showToast('Answer at least 5 habits first!', 'error'); return; }

            var submitted = getSubmittedDays();
            if (submitted[dk]) { showToast('Already submitted today!', 'info'); return; }

            submitted[dk] = {
                time: new Date().toISOString(),
                habits: state.habits.map(function(h) {
                    var log = dayLogs[h.id] || { value: 0, notes: '' };
                    return { name: h.name, value: log.value, goal: h.goal, completed: log.completed || false, notes: log.notes || '' };
                })
            };
            localStorage.setItem('habitTracker_submitted', JSON.stringify(submitted));

            showToast('\uD83C\uDF89 Day submitted successfully! Great work!', 'success');
            renderSubmitBar();
            checkNewAchievements();
        }

        // ===== MOOD CHECK-IN =====
        function getMoodData() {
            var raw = localStorage.getItem('habitTracker_moods');
            return raw ? JSON.parse(raw) : {};
        }

        function saveMoodData(data) {
            localStorage.setItem('habitTracker_moods', JSON.stringify(data));
        }

        function renderMoodCheckin() {
            var dk = dateKey(state.viewDate);
            var moods = getMoodData();
            var today = moods[dk] || {};
            // Highlight selected mood
            document.querySelectorAll('.mood-btn').forEach(function(btn) {
                btn.classList.toggle('selected', btn.dataset.mood === String(today.mood || 0));
            });
            // Set energy slider
            document.getElementById('energySlider').value = today.energy || 5;
            document.getElementById('energyVal').textContent = today.energy || 5;
            // Show insight
            renderMoodInsight(dk);
        }

        function renderMoodInsight(dk) {
            var moods = getMoodData();
            var insight = document.getElementById('moodInsight');
            // Analyze last 7 days
            var moodSum = 0, energySum = 0, count = 0;
            for (var i = 0; i < 7; i++) {
                var d = new Date(); d.setDate(d.getDate() - i);
                var k = dateKey(d);
                if (moods[k] && moods[k].mood) {
                    moodSum += moods[k].mood;
                    energySum += moods[k].energy || 5;
                    count++;
                }
            }
            if (count < 2) { insight.classList.remove('visible'); return; }

            var avgMood = (moodSum / count).toFixed(1);
            var avgEnergy = (energySum / count).toFixed(1);
            var rate = getCompletionRate(state.viewDate);

            var moodLabel = avgMood >= 4 ? 'great' : avgMood >= 3 ? 'okay' : 'low';
            var tip = '';
            if (avgMood >= 4 && rate >= 70) tip = '\uD83D\uDCAA Your mood and habits are strongly aligned. Keep it up!';
            else if (avgMood < 3 && rate < 50) tip = '\uD83C\uDF31 Low mood + low completion. Start small \u2014 even 1 habit counts.';
            else if (avgMood >= 4 && rate < 50) tip = '\u26A1 Great mood but low tracking \u2014 channel that energy into your habits!';
            else if (avgMood < 3 && rate >= 70) tip = '\uD83C\uDFC6 Pushing through despite tough days. That\'s real discipline.';
            else tip = '\uD83D\uDCC8 7-day avg: mood ' + avgMood + '/5, energy ' + avgEnergy + '/10. ' + count + ' days logged.';

            insight.textContent = tip;
            insight.classList.add('visible');
        }

        // ===== LEADERBOARD =====
        function renderLeaderboard() {
            var container = document.getElementById('leaderboardContent');
            if (state.habits.length === 0) {
                container.innerHTML = '<div class="history-empty"><div class="empty-icon">\uD83C\uDFC6</div><h3>No habits to rank</h3><p>Add habits to see the leaderboard.</p></div>';
                return;
            }

            var ranked = state.habits.map(function(h) {
                var streak = getStreak(h.id);
                var bestStreak = getBestStreak(h.id);
                var totalDone = 0, totalDays = 0;
                Object.keys(state.logs).forEach(function(dk) {
                    if (state.logs[dk][h.id]) {
                        totalDays++;
                        if (state.logs[dk][h.id].completed) totalDone++;
                    }
                });
                var consistency = totalDays > 0 ? Math.round((totalDone / totalDays) * 100) : 0;
                // Score: weighted combination
                var score = (streak * 3) + (bestStreak * 2) + consistency;
                return { habit: h, streak: streak, bestStreak: bestStreak, totalDone: totalDone, consistency: consistency, score: score };
            }).sort(function(a, b) { return b.score - a.score; });

            var maxScore = ranked[0].score || 1;

            container.innerHTML = ranked.map(function(r, i) {
                var rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : 'normal';
                var medal = i === 0 ? '\uD83E\uDD47' : i === 1 ? '\uD83E\uDD48' : i === 2 ? '\uD83E\uDD49' : (i + 1);
                var barPct = Math.round((r.score / maxScore) * 100);

                return '<div class="lb-item">' +
                    '<div class="lb-rank ' + rankClass + '">' + medal + '</div>' +
                    '<div class="lb-info">' +
                        '<div class="lb-name">' + escHtml(r.habit.emoji) + ' ' + escHtml(r.habit.name) + '</div>' +
                        '<div class="lb-stats">\uD83D\uDD25 ' + r.streak + ' streak \u00B7 \u2B50 ' + r.bestStreak + ' best \u00B7 ' + r.consistency + '% consistent</div>' +
                    '</div>' +
                    '<div class="lb-bar"><div class="lb-bar-fill" style="width:' + barPct + '%"></div></div>' +
                    '<div class="lb-score">' + r.score + '<small>points</small></div>' +
                '</div>';
            }).join('');
        }

        // ===== FOCUS MODE =====
        var focusMode = false;
        var focusIndex = 0;

        function toggleFocusMode() {
            focusMode = !focusMode;
            document.getElementById('focusToggle').classList.toggle('on', focusMode);
            document.getElementById('focusNav').classList.toggle('hidden', !focusMode);
            if (focusMode) focusIndex = 0;
            renderHabits();
        }

        function applyFocusMode() {
            if (!focusMode) return;
            var cards = document.querySelectorAll('#habitsList .habit-card');
            if (cards.length === 0) return;
            if (focusIndex >= cards.length) focusIndex = 0;
            cards.forEach(function(card, i) {
                card.classList.remove('focus-dimmed', 'focus-active');
                if (i === focusIndex) card.classList.add('focus-active');
                else card.classList.add('focus-dimmed');
            });
            document.getElementById('focusCounter').textContent = (focusIndex + 1) + ' / ' + cards.length;
            // Scroll active into view
            cards[focusIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function focusNext() {
            var cards = document.querySelectorAll('#habitsList .habit-card');
            if (cards.length === 0) return;
            focusIndex = (focusIndex + 1) % cards.length;
            applyFocusMode();
        }

        function focusPrev() {
            var cards = document.querySelectorAll('#habitsList .habit-card');
            if (cards.length === 0) return;
            focusIndex = (focusIndex - 1 + cards.length) % cards.length;
            applyFocusMode();
        }

        // Patch renderHabits to apply focus after render
        var _origRenderHabits = renderHabits;
        renderHabits = function() {
            _origRenderHabits();
            if (focusMode) applyFocusMode();
        };

        // ===== HISTORY VIEW =====

            var container = document.getElementById('historyContent');
            var submitted = getSubmittedDays();
            var dk = dateKey(state.viewDate);
            var dayLog = state.logs[dk] || {};
            var isSubmitted = !!submitted[dk];
            var submittedTime = isSubmitted && submitted[dk].time ? new Date(submitted[dk].time).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) : '';

            var dateStr = new Date(state.viewDate).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            // Check if any activity exists for this date
            var hasActivity = Object.keys(dayLog).some(function(hid) {
                return dayLog[hid] && dayLog[hid].value > 0;
            });

            if (!hasActivity && state.habits.length === 0) {
                container.innerHTML = '<div class="history-empty"><div class="empty-icon">\uD83D\uDCCB</div>' +
                    '<h3>No habits created</h3><p>Add habits and start tracking to see history.</p></div>';
                return;
            }

            var totalGoalMet = 0;
            var totalAnswered = 0;
            state.habits.forEach(function(h) {
                var log = dayLog[h.id];
                if (log && log.value > 0) totalAnswered++;
                if (log && log.completed) totalGoalMet++;
            });
            var isPerfect = totalGoalMet === state.habits.length && state.habits.length > 0;
            var completionPct = state.habits.length > 0 ? Math.round((totalGoalMet / state.habits.length) * 100) : 0;

            // Show ALL habits for the selected date, even ones with no activity
            var habitsHtml = state.habits.map(function(h) {
                var log = dayLog[h.id] || { value: 0, completed: false, notes: '' };
                var goalMet = log.completed;
                var hPct = h.goal > 0 ? Math.min(100, Math.round((log.value / h.goal) * 100)) : 0;
                var barColor = goalMet ? 'var(--success)' : (hPct >= 50 ? 'var(--warning)' : (log.value > 0 ? 'var(--accent)' : 'var(--border)'));

                return '<div class="history-habit-item">' +
                    '<div class="hh-emoji">' + escHtml(h.emoji) + '</div>' +
                    '<div class="hh-info">' +
                        '<div class="hh-name">' + escHtml(h.name) + '</div>' +
                        '<div class="hh-progress-row">' +
                            '<div class="hh-bar"><div class="hh-bar-fill" style="width:' + hPct + '%;background:' + barColor + '"></div></div>' +
                            '<div class="hh-val">' + log.value + '/' + h.goal + (h.unit ? ' ' + escHtml(h.unit) : '') + '</div>' +
                        '</div>' +

        function renderCalendar() {
            var year = state.calendarMonth.getFullYear();
            var month = state.calendarMonth.getMonth();
            var firstDay = new Date(year, month, 1).getDay();
            var daysInMonth = new Date(year, month + 1, 0).getDate();
            document.getElementById('calendarTitle').textContent = new Date(year, month).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            var grid = document.getElementById('calendarGrid');
            var dayLabels = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            var html = dayLabels.map(function(d) { return '<div class="calendar-day-label">' + d + '</div>'; }).join('');
            for (var i = 0; i < firstDay; i++) html += '<div class="calendar-day empty"></div>';
            var today = new Date();
            for (var day = 1; day <= daysInMonth; day++) {
                var d = new Date(year, month, day);
                var rate = getCompletionRate(d);
                var isTodayClass = (d.getDate() === today.getDate() && d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear()) ? 'today' : '';
                var levelClass = 'no-completion';
                if (rate === 100) levelClass = 'full-completion';
                else if (rate > 0) levelClass = 'partial-completion';
                html += '<div class="calendar-day ' + isTodayClass + ' ' + levelClass + '" title="' + formatShortDate(d) + ': ' + rate + '% complete">' + day + '</div>';
            }
            grid.innerHTML = html;
        }

        function renderHeatmap() {
            var grid = document.getElementById('heatmapGrid');
            var days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            var today = new Date();
            var startOfWeek = new Date(today);
            startOfWeek.setDate(today.getDate() - today.getDay() + 1);
            var html = '<div></div>';
            for (var i = 0; i < 7; i++) {
                var d = new Date(startOfWeek); d.setDate(d.getDate() + i);
                html += '<div class="heatmap-day-label">' + days[i] + '<br><small>' + d.getDate() + '</small></div>';
            }
            state.habits.forEach(function(habit) {
                html += '<div class="heatmap-habit-name">' + escHtml(habit.emoji) + ' ' + escHtml(habit.name) + '</div>';
                for (var i = 0; i < 7; i++) {
                    var d = new Date(startOfWeek); d.setDate(d.getDate() + i);
                    var log = getLog(d, habit.id);
                    var value = log ? log.value : 0;
                    var pct = Math.min(100, Math.round((value / habit.goal) * 100));
                    var level = 0;
                    if (pct >= 100) level = 4; else if (pct >= 75) level = 3; else if (pct >= 50) level = 2; else if (pct > 0) level = 1;
                    html += '<div class="heatmap-cell level-' + level + '" title="' + formatShortDate(d) + ': ' + value + '/' + habit.goal + '">' + (pct > 0 ? pct + '%' : '') + '</div>';
                }
            });
            grid.innerHTML = html;
        }

            setLog(state.viewDate, habitId, newVal);

            render();
        }

        function decrement(habitId) {
            var log = getLog(state.viewDate, habitId);

        }

        // ===== CONFETTI =====
        var confettiPieces = [];
        var confettiRunning = false;
        var confettiCanvas = null;
        var confettiCtx = null;

        function launchConfetti() {
            confettiCanvas = document.getElementById('confettiCanvas');
            confettiCtx = confettiCanvas.getContext('2d');
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
            confettiPieces = [];
            var colors = ['#6c63ff','#a78bfa','#2dd4a0','#fbbf24','#ff6b8a','#38bdf8','#f472b6','#34d399'];
            for (var i = 0; i < 150; i++) {
                confettiPieces.push({
                    x: Math.random() * confettiCanvas.width,
                    y: Math.random() * confettiCanvas.height - confettiCanvas.height,
                    w: Math.random() * 10 + 5,
                    h: Math.random() * 6 + 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: (Math.random() - 0.5) * 4,
                    vy: Math.random() * 3 + 2,
                    rot: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 10,
                    opacity: 1,
                });
            }
            confettiRunning = true;
            animateConfetti();
        }

        function animateConfetti() {
            if (!confettiRunning) return;
            confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            var alive = false;
            confettiPieces.forEach(function(p) {
                if (p.opacity <= 0) return;
                alive = true;
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.05;
                p.rot += p.rotSpeed;
                if (p.y > confettiCanvas.height + 20) p.opacity -= 0.02;
                p.opacity = Math.max(0, p.opacity - 0.003);
                confettiCtx.save();
                confettiCtx.translate(p.x, p.y);
                confettiCtx.rotate(p.rot * Math.PI / 180);
                confettiCtx.globalAlpha = p.opacity;
                confettiCtx.fillStyle = p.color;
                confettiCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                confettiCtx.restore();
            });
            if (alive) requestAnimationFrame(animateConfetti);
            else {
                confettiRunning = false;
                confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            }
        }

        function savePomoSession() {

            ps.sessions[dk].count++;
            ps.sessions[dk].minutes += Math.round(pomo.duration / 60);

            localStorage.setItem('habitTracker_pomo', JSON.stringify(ps));

        function renderPomoStats() {
            var ps = getPomoStats();
            var dk = dateKey(new Date());
            var today = ps.sessions[dk] || { count: 0, minutes: 0 };
            document.getElementById('pomoSessionCount').textContent = today.count;
            document.getElementById('pomoTotalMins').textContent = today.minutes;
            document.getElementById('pomoAllTime').textContent = ps.allTime || 0;
