        function updatePomoDisplay() {
            var mins = Math.floor(pomo.remaining / 60);
            var secs = pomo.remaining % 60;
            document.getElementById('pomoDisplay').textContent = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');

            var circumference = 2 * Math.PI * 90;
            var progress = 1 - (pomo.remaining / pomo.duration);
            document.getElementById('pomoRing').style.strokeDashoffset = circumference * (1 - progress);

            document.getElementById('pomoRingLabel').textContent = pomo.running ? (pomo.phase === 'focus' ? 'focusing' : 'break') : 'ready';
            document.getElementById('pomoPhaseLabel').textContent = pomo.phase === 'focus' ? 'Focus Time' : 'Break Time';

            document.title = (pomo.running ? String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0') + ' - ' : '') + 'Personal Habit Tracker';
        }

        function startPomo() {
            if (pomo.running) {
                clearInterval(pomo.interval);
                pomo.running = false;
                document.getElementById('pomoStartBtn').textContent = 'Resume';
                updatePomoDisplay();
                return;
            }
            pomo.running = true;
            document.getElementById('pomoStartBtn').textContent = 'Pause';
            pomo.interval = setInterval(function() {
                pomo.remaining--;
                if (pomo.remaining <= 0) {
                    clearInterval(pomo.interval);
                    pomo.running = false;
                    document.getElementById('pomoStartBtn').textContent = 'Start';
                    if (pomo.phase === 'focus') {
                        savePomoSession();
                        renderPomoStats();
                        checkNewAchievements();
                        showToast('\u23F0 Focus session complete! Take a break.', 'success');
                        pomo.phase = 'break';
                        pomo.duration = 5 * 60;
                        pomo.remaining = 5 * 60;
                    } else {
                        showToast('\u2615 Break over! Ready for another focus session?', 'info');
                        pomo.phase = 'focus';
                        pomo.duration = 25 * 60;
                        pomo.remaining = 25 * 60;
                    }
                    document.title = 'Personal Habit Tracker';
                }
                updatePomoDisplay();
            }, 1000);
            updatePomoDisplay();
        }

        function resetPomo() {
            clearInterval(pomo.interval);
            pomo.running = false;
            pomo.phase = 'focus';
            pomo.remaining = pomo.duration;
            document.getElementById('pomoStartBtn').textContent = 'Start';
            document.title = 'Personal Habit Tracker';
            updatePomoDisplay();
        }

        // ===== WRAP ORIGINAL ACTIONS TO TRIGGER CONFETTI + ACHIEVEMENTS =====
        var _origIncrement = increment;
        increment = function(habitId) {
            _origIncrement(habitId);
            checkAllCompleted();
            checkNewAchievements();
        };

        var _origToggleCheck = toggleCheck;
        toggleCheck = function(habitId) {
            _origToggleCheck(habitId);
            checkAllCompleted();
            checkNewAchievements();
        };

        function init() {
            loadTheme();
            load();

            document.getElementById('addHabitBtn').addEventListener('click', openAddModal);
            document.getElementById('closeModal').addEventListener('click', closeModal);
            document.getElementById('cancelModal').addEventListener('click', closeModal);
            document.getElementById('saveHabit').addEventListener('click', saveHabit);
            document.getElementById('deleteHabit').addEventListener('click', deleteHabitAction);
            document.getElementById('closeDetailModal').addEventListener('click', closeDetailModal);
            document.getElementById('submitDayBtn').addEventListener('click', submitDay);
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            document.getElementById('exportBtn').addEventListener('click', exportData);
            document.getElementById('importBtn').addEventListener('click', function() { document.getElementById('importFile').click(); });
            document.getElementById('importFile').addEventListener('change', function(e) {
                if (e.target.files[0]) importData(e.target.files[0]);
                e.target.value = '';
            });

            document.getElementById('prevDate').addEventListener('click', function() {
                state.viewDate = new Date(state.viewDate); state.viewDate.setDate(state.viewDate.getDate() - 1); render();
            });
            document.getElementById('nextDate').addEventListener('click', function() {
                state.viewDate = new Date(state.viewDate); state.viewDate.setDate(state.viewDate.getDate() + 1); render();
            });
            document.getElementById('prevMonth').addEventListener('click', function() {
                state.calendarMonth = new Date(state.calendarMonth.getFullYear(), state.calendarMonth.getMonth() - 1, 1); renderCalendar();
            });
            document.getElementById('nextMonth').addEventListener('click', function() {
                state.calendarMonth = new Date(state.calendarMonth.getFullYear(), state.calendarMonth.getMonth() + 1, 1); renderCalendar();
            });

            document.querySelector('.tabs').addEventListener('click', function(e) {
                var tab = e.target.closest('.tab');
                if (!tab) return;
                document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
                tab.classList.add('active');
                state.activeView = tab.dataset.view;
                ['todayView','calendarView','heatmapView','achievementsView','pomodoroView','leaderboardView','historyView'].forEach(function(id) {
                    document.getElementById(id).style.display = 'none';
                });
                var viewMap = {today:'todayView',calendar:'calendarView',heatmap:'heatmapView',achievements:'achievementsView',pomodoro:'pomodoroView',leaderboard:'leaderboardView',history:'historyView'};
                document.getElementById(viewMap[state.activeView]).style.display = '';
                if (state.activeView === 'calendar') renderCalendar();
                if (state.activeView === 'heatmap') renderHeatmap();
                if (state.activeView === 'achievements') renderAchievements();
                if (state.activeView === 'pomodoro') renderPomoStats();
                if (state.activeView === 'leaderboard') renderLeaderboard();
                if (state.activeView === 'history') renderHistory();
            });

            document.getElementById('filterPills').addEventListener('click', function(e) {
                var pill = e.target.closest('.pill');
                if (!pill) return;
                document.querySelectorAll('.pill').forEach(function(p) { p.classList.remove('active'); });
                pill.classList.add('active');
                state.activeFilter = pill.dataset.filter;
                renderHabits();
            });

            document.getElementById('habitsList').addEventListener('click', function(e) {
                var btn = e.target.closest('[data-action]');
                if (!btn) return;
                var action = btn.dataset.action, id = btn.dataset.id;
                if (action === 'increment') increment(id);
                else if (action === 'decrement') decrement(id);
                else if (action === 'toggle') toggleCheck(id);
                else if (action === 'detail') openDetail(id);
                else if (action === 'edit') editHabit(id);
            });

            document.getElementById('habitsList').addEventListener('change', function(e) {
                if (e.target.dataset.action === 'notes') updateNotes(e.target.dataset.id, e.target.value);
            });

            document.getElementById('emojiPicker').addEventListener('click', function(e) {
                var btn = e.target.closest('.emoji-option');
                if (!btn) return;
                document.querySelectorAll('.emoji-option').forEach(function(el) { el.classList.remove('selected'); });
                btn.classList.add('selected');
                selectedEmoji = btn.dataset.emoji;
            });

            document.querySelectorAll('.modal-overlay').forEach(function(overlay) {
                overlay.addEventListener('click', function(e) {
                    if (e.target === overlay) { overlay.classList.remove('active'); state.editingHabitId = null; }
                });
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    document.querySelectorAll('.modal-overlay').forEach(function(o) { o.classList.remove('active'); });
                    state.editingHabitId = null;
                }
            });

            document.getElementById('habitType').addEventListener('change', function(e) {
                document.getElementById('habitUnit').closest('.form-group').style.display = e.target.value === 'counter' ? '' : 'none';
            });

            // Pomodoro
            document.getElementById('pomoStartBtn').addEventListener('click', startPomo);
            document.getElementById('pomoResetBtn').addEventListener('click', resetPomo);
            document.querySelector('.pomodoro-presets').addEventListener('click', function(e) {
                var pill = e.target.closest('.pill');
                if (!pill) return;
                document.querySelectorAll('.pomodoro-presets .pill').forEach(function(p) { p.classList.remove('active'); });
                pill.classList.add('active');
                var mins = parseInt(pill.dataset.pomoMins, 10);
                clearInterval(pomo.interval);
                pomo.running = false;
                pomo.phase = mins <= 10 ? 'break' : 'focus';
                pomo.duration = mins * 60;
                pomo.remaining = mins * 60;
                document.getElementById('pomoStartBtn').textContent = 'Start';
                document.title = 'Personal Habit Tracker';
                updatePomoDisplay();
            });
            updatePomoDisplay();
            renderPomoStats();

            // Mood check-in
            document.getElementById('moodOptions').addEventListener('click', function(e) {
                var btn = e.target.closest('.mood-btn');
                if (!btn) return;
                var dk = dateKey(state.viewDate);
                var moods = getMoodData();
                if (!moods[dk]) moods[dk] = {};
                moods[dk].mood = parseInt(btn.dataset.mood, 10);
                saveMoodData(moods);
                renderMoodCheckin();
                playSound('click');
            });
            document.getElementById('energySlider').addEventListener('input', function(e) {
                document.getElementById('energyVal').textContent = e.target.value;
                var dk = dateKey(state.viewDate);
                var moods = getMoodData();
                if (!moods[dk]) moods[dk] = {};
                moods[dk].energy = parseInt(e.target.value, 10);
                saveMoodData(moods);
                renderMoodInsight(dk);
            });

            // Focus mode
            document.getElementById('focusToggle').addEventListener('click', toggleFocusMode);
            document.getElementById('focusNext').addEventListener('click', focusNext);
            document.getElementById('focusPrev').addEventListener('click', focusPrev);

            render();
        }

        // ===== SOUND EFFECTS (Web Audio API) =====
        var audioCtx = null;
        function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        }

        function playSound(type) {
            try {
                var ctx = getAudioCtx();
                if (ctx.state === 'suspended') ctx.resume();
                var osc = ctx.createOscillator();
                var gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'complete') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523, ctx.currentTime);
                    osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'allDone') {
                    osc.type = 'sine';
                    var notes = [523, 659, 784, 1047];
                    notes.forEach(function(freq, i) {
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.12);
                    });
                    gain.gain.setValueAtTime(0.18, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.6);
                } else if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    gain.gain.setValueAtTime(0.06, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'achievement') {
                    osc.type = 'triangle';
                    var achNotes = [523, 659, 784, 1047, 1319];
                    achNotes.forEach(function(freq, i) {
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
                    });
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.7);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.7);
                } else if (type === 'timer') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.setValueAtTime(0, ctx.currentTime + 0.15);
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.3);
                    osc.frequency.setValueAtTime(0, ctx.currentTime + 0.45);
                    osc.frequency.setValueAtTime(1100, ctx.currentTime + 0.6);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.9);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.9);
                }
            } catch(e) { /* audio not supported */ }
        }

        // Patch showToast to play sounds
        var _origShowToast = showToast;
        showToast = function(message, type) {
            _origShowToast(message, type);
            if (message.indexOf('completed') !== -1 || message.indexOf('done') !== -1) playSound('complete');
            else if (message.indexOf('All habits') !== -1 || message.indexOf('Amazing') !== -1) playSound('allDone');
            else if (message.indexOf('Achievement') !== -1) playSound('achievement');
            else if (message.indexOf('Focus session') !== -1 || message.indexOf('Break over') !== -1) playSound('timer');
        };

        // ===== SERVICE WORKER =====
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(function(err) {
                console.log('SW registration failed:', err);
            });
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
    })();
    </script>
</body>
